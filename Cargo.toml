[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "moonbyte"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
poise = { version = "0.7.1", default-features = false }
serenity = { version = "0.12.5", default-features = false, features = ["rustls_backend"] }
tokio = { version = "~1.53.1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "moonbyte"
path = "src/main.rs"

[lints]
workspace = true
