services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moonbyte
      POSTGRES_USER: moonbyte
      POSTGRES_PASSWORD: moonbyte
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moonbyte-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonbyte -d moonbyte"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  moonbyte-postgres: