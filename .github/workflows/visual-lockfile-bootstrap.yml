name: Temporary visual-library lockfile bootstrap

on:
  push:
    branches:
      - automation/moonbyte-lockfile-bootstrap-2026-11-22

permissions:
  contents: read

jobs:
  bootstrap:
    name: Resolve and verify visual-library dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: visual-library
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Generate a candidate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install from the candidate lockfile
        run: npm ci --no-audit --no-fund

      - name: Type-check the visual library
        run: npm run typecheck

      - name: Build the visual library
        run: npm run build

      - name: Preserve the verified lockfile for the final commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moonbyte-visual-library-lockfile
          path: visual-library/package-lock.json
          if-no-files-found: error
          retention-days: 1
