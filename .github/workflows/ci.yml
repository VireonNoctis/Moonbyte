name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moonbyte
          POSTGRES_USER: moonbyte
          POSTGRES_PASSWORD: moonbyte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moonbyte -d moonbyte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://moonbyte:moonbyte@localhost:5432/moonbyte
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository configuration
        run: python3 scripts/validate.py

      - name: Test repository validation helpers
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master at 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Verify the committed dependency lockfile
        run: |
          test -f Cargo.lock
          git ls-files --error-unmatch Cargo.lock

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace against PostgreSQL
        run: cargo test --workspace --locked

      - name: Check Rust code with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
